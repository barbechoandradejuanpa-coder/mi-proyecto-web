// ── HELPERS ──────────────────────────────────────────────────
function nearAge(m,d){const a=Object.keys(d).map(Number).sort((a,b)=>a-b);return a.reduce((p,c)=>Math.abs(c-m)<Math.abs(p-m)?c:p);}
function pct(v,r){if(!r||v==null)return null;const[p3,p50,p97]=r;if(v<p3)return{l:"< P3 ⚠",c:"#b71c1c"};if(v<p50*0.87)return{l:"P3-P15",c:"#e65100"};if(v<=p50*1.13)return{l:"P15-P85 ✓",c:"#2e7d32"};if(v<=p97)return{l:"P85-P97",c:"#e65100"};return{l:"> P97 ⚠",c:"#b71c1c"};}
function calcAge(dob){if(!dob)return null;const t=new Date(),b=new Date(dob);let y=t.getFullYear()-b.getFullYear(),m=t.getMonth()-b.getMonth();if(m<0||(m===0&&t.getDate()<b.getDate())){y--;m+=12;}return{years:y,months:m,totalMonths:y*12+m};}
function calcIMC(p,t){if(!p||!t||parseFloat(t)<=0)return null;return(parseFloat(p)/(parseFloat(t)/100)**2).toFixed(1);}
function calcFPP(fum){if(!fum)return null;const d=new Date(fum);d.setDate(d.getDate()+280);return d.toISOString().split('T')[0];}
function calcEG(fum){if(!fum)return null;const diff=new Date()-new Date(fum);if(diff<0)return null;const days=Math.floor(diff/86400000);return{weeks:Math.floor(days/7),days:days%7};}
function fd(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function imcCat(v){const n=parseFloat(v);if(n<18.5)return{l:'Bajo peso',c:'#1565c0'};if(n<25)return{l:'Normal',c:'#2e7d32'};if(n<30)return{l:'Sobrepeso',c:'#f57f17'};if(n<35)return{l:'Obesidad I',c:'#e65100'};if(n<40)return{l:'Obesidad II',c:'#b71c1c'};return{l:'Obesidad III',c:'#7b1fa2'};}

// ── IMPRIMIR HCL ─────────────────────────────────────────────
function imprimirConsulta(patient, user, consulta){
  const age=calcAge(patient.fechaNacimiento);
  const isPed=age&&age.years<18;
  const imc=consulta._imc||(consulta.peso&&consulta.talla?calcIMC(consulta.peso,consulta.talla):null);
  const ic=imc?imcCat(imc):null;
  const eg=patient.embarazada==='Sí'&&patient.fum?calcEG(patient.fum):null;
  const r=(l,v)=>v?`<tr><td style="padding:5px 8px;color:#555;width:185px;font-size:12px;border-bottom:1px solid #eee;vertical-align:top">${l}</td><td style="padding:5px 8px;font-size:12px;border-bottom:1px solid #eee">${v}</td></tr>`:'';
  const sec=(hBg,icon,title,body)=>`<div style="margin-bottom:14px;border-radius:8px;overflow:hidden;border:1.5px solid ${hBg}44"><div style="background:${hBg};padding:8px 12px;color:#fff;font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase">${icon} ${title}</div><div style="padding:12px;background:#fff">${body}</div></div>`;
  const sv=(l,v,u)=>v?`<span style="display:inline-block;margin:4px;padding:8px 12px;background:#f8f8f8;border-radius:6px;border:1px solid #ddd;text-align:center;min-width:85px"><div style="font-size:9px;color:#666;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:3px">${l}</div><div style="font-size:17px;font-weight:700;color:#222">${v} <span style="font-size:10px">${u}</span></div></span>`:'';

  const ginoHtml=patient.sexo==='F'?sec('#993556','🌸','Antecedentes Ginecoobstétricos',`<table style="width:100%;border-collapse:collapse">
    ${r('Menarquía',patient.menarquia?patient.menarquia+' años':null)}
    ${r('Ciclos / Duración',patient.ciclosRegulares?(patient.ciclosRegulares+(patient.duracionCiclo?' — '+patient.duracionCiclo+'d':'')):null)}
    ${r('Cantidad flujo',patient.cantidadFlujo)}
    ${r('Inicio vida sexual',patient.inicioVidaSexual?patient.inicioVidaSexual+' años':null)}
    ${r('N° parejas',patient.numParejas)}
    ${(patient.gesta||patient.para)?r('Fórmula obstétrica',`G${patient.gesta||0} P${patient.para||0} C${patient.cesareas||0} A${patient.abortos||0}`):''}
    ${r('Menopausia',patient.menopausia)}
    ${r('PAP Test',patient.papTest==='Sí'?`Sí — ${fd(patient.papTestFecha)||'sin fecha'}`:patient.papTest)}
    ${r('Mamografía',patient.mamografia==='Sí'?`Sí — ${fd(patient.mamografiaFecha)||'sin fecha'}`:patient.mamografia)}
    ${r('Anticoncepción',patient.anticonceptivos?patient.anticonceptivos+(patient.anticonceptivosDetalle?' — '+patient.anticonceptivosDetalle:''):null)}
    ${r('FUM',fd(patient.fum))}
    ${r('Embarazo actual',patient.embarazada)}
    ${eg?r('Edad gestacional',eg.weeks+' sem'+(eg.days?' + '+eg.days+'d':'')):''}
    ${patient.embarazada==='Sí'&&patient.fum?r('FPP',fd(calcFPP(patient.fum))):''}
  </table>`):'';

  const dxHtml=consulta.diagnosticos?.map(dx=>`<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #eee;align-items:center"><span style="background:${dx.tipo==='Definitivo'?'#FAC775':dx.tipo==='Presuntivo'?'#B5D4F4':'#ddd'};padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap">${dx.tipo}</span>${dx.codigo?`<span style="font-family:monospace;font-size:11px;color:#999">${dx.codigo}</span>`:''}<span style="font-size:12px">${dx.descripcion}</span></div>`).join('')||'<p style="color:#999;font-size:12px">Sin diagnósticos registrados.</p>';
  const notasHtml=consulta.notasEvolucion?.map(n=>`<div style="padding:8px 10px;border-left:3px solid #D85A30;margin-bottom:8px;background:#fff8f5"><div style="font-size:10px;color:#999">${fd(n.fecha)} ${n.hora} · ${n.medico||''}</div><div style="font-size:12px;margin-top:3px;white-space:pre-wrap">${n.texto}</div></div>`).join('')||'<p style="color:#999;font-size:12px">Sin notas.</p>';

  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>HCL — ${patient.nombres} ${patient.apellidos}</title>
  <style>body{font-family:'Segoe UI',Arial,sans-serif;font-size:13px;color:#222;margin:24px;max-width:820px}@media print{body{margin:0}}.no-print{display:flex;gap:8px;margin-bottom:16px}@media print{.no-print{display:none}}</style></head><body>
  <div class="no-print">
    <button onclick="window.print()" style="padding:8px 18px;background:#0F4C75;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-weight:600">🖨️ Imprimir / Guardar PDF</button>
    <button onclick="window.close()" style="padding:8px 18px;background:#fff;border:1px solid #ccc;border-radius:6px;font-size:13px;cursor:pointer">Cerrar</button>
  </div>
  <div style="background:#0F4C75;color:#fff;padding:14px 20px;border-radius:8px;margin-bottom:16px">
    <div style="font-size:10px;opacity:0.7;margin-bottom:6px">${CENTRO}</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div style="font-size:20px;font-weight:700">${patient.nombres} ${patient.apellidos}</div>
        <div style="font-size:12px;opacity:0.85;margin-top:4px">CI: ${patient.cedula||'—'} · ${patient.sexo==='M'?'Masculino':'Femenino'} · ${age?age.years+' años '+age.months+' meses':'—'} · ${patient.estadoCivil||''} · ${patient.ocupacion||''}</div>
      </div>
      <div style="text-align:right;font-size:11px;opacity:0.85">
        <div style="font-weight:600">${user.nombre}</div>
        <div>${user.especialidad}</div>
        <div style="margin-top:4px">Fecha: ${fd(consulta.fecha)} ${consulta.hora}</div>
      </div>
    </div>
  </div>
  ${sec('#185FA5','👤','Datos de Filiación',`<table style="width:100%;border-collapse:collapse">${r('Fecha nacimiento',fd(patient.fechaNacimiento))}${r('Estado civil',patient.estadoCivil)}${r('Religión',patient.religion)}${r('Teléfono',patient.telefono)}${r('Email',patient.email)}${r('Dirección',patient.direccion)}</table>`)}
  ${sec('#534AB7','📂','Antecedentes Personales',`<b style="font-size:11px;color:#534AB7">PATOLÓGICOS</b><p style="margin:4px 0 10px;font-size:12px;white-space:pre-wrap">${patient.antPatologicos||'No registrado'}</p><b style="font-size:11px;color:#534AB7">QUIRÚRGICOS</b><p style="margin:4px 0 10px;font-size:12px;white-space:pre-wrap">${patient.antQuirurgicos||'No registrado'}</p>${patient.antAlergias?`<b style="font-size:11px;color:#c62828">⚠ ALERGIAS:</b> <span style="color:#c62828;font-weight:700">${patient.antAlergias}</span>`:''}${patient.antFamiliares?`<br><b style="font-size:11px;color:#534AB7">FAMILIARES:</b> <span style="font-size:12px">${patient.antFamiliares}</span>`:''}`)}
  ${ginoHtml}
  ${sec('#3B6D11','🥗','Hábitos',`<b style="font-size:11px;color:#3B6D11">ALIMENTACIÓN:</b> <span style="font-size:12px">${patient.alimentacion||'No registrado'}</span><br><b style="font-size:11px;color:#3B6D11">ALCOHOL:</b> <span style="font-size:12px">${patient.alcohol||'—'}${patient.alcoholDetalle?' — '+patient.alcoholDetalle:''}</span>&nbsp;&nbsp;<b style="font-size:11px;color:#3B6D11">TABACO:</b> <span style="font-size:12px">${patient.cigarrillo||'—'}${patient.cigarrilloDetalle?' — '+patient.cigarrilloDetalle:''}</span>${patient.otrosHabitos?`<br><b style="font-size:11px;color:#3B6D11">OTROS:</b> <span style="font-size:12px">${patient.otrosHabitos}</span>`:''}`)}
  ${sec('#0C447C','💬','Motivo de Consulta',`<p style="font-size:14px;font-weight:700;margin:0 0 8px">${consulta.motivoConsulta||''}</p><p style="font-size:12px;white-space:pre-wrap;margin:0;color:#444">${consulta.enfermedadActual||''}</p>`)}
  ${sec('#0F6E56','🩺','Examen Físico',`<div style="margin-bottom:12px">${sv('Peso',consulta.peso,'kg')}${sv('Talla',consulta.talla,'cm')}${!isPed&&imc?sv('IMC',imc,'kg/m²'):''}${isPed&&consulta.perimetroCefalico?sv('P. Cefálico',consulta.perimetroCefalico,'cm'):''}${!isPed&&consulta.perimetroAbdominal?sv('P. Abdominal',consulta.perimetroAbdominal,'cm'):''}${consulta.taSis?sv('T.A.',consulta.taSis+'/'+consulta.taDia,'mmHg'):''}${consulta.fc?sv('FC',consulta.fc,'lpm'):''}${consulta.fr?sv('FR',consulta.fr,'rpm'):''}${consulta.temp?sv('Temp',consulta.temp,'°C'):''}${consulta.sat?sv('SpO2',consulta.sat,'%'):''}${consulta.glicemia?sv('Glicemia',consulta.glicemia,'mg/dL'):''}</div>${consulta.examenFisico?`<p style="font-size:12px;white-space:pre-wrap;margin:0;border-top:1px solid #ddd;padding-top:10px">${consulta.examenFisico}</p>`:''}`)}
  ${sec('#BA7517','🔬','Diagnósticos',dxHtml)}
  ${consulta.tratamiento?sec('#3B6D11','💊','Plan Terapéutico',`<p style="font-size:12px;white-space:pre-wrap;margin:0;line-height:1.8">${consulta.tratamiento}</p>`):''}
  ${(consulta.examenesLab||consulta.examenes)?sec('#534AB7','🔬','Pedido de exámenes de laboratorio clínico',`<p style="font-size:12px;white-space:pre-wrap;margin:0;line-height:1.8">${consulta.examenesLab||consulta.examenes}</p>`):''}
  ${consulta.examenesImagenes?sec('#0C447C','🖼️','Pedido de imágenes',`<p style="font-size:12px;white-space:pre-wrap;margin:0;line-height:1.8">${consulta.examenesImagenes}</p>`):''}
  ${sec('#993C1D','📝','Notas de Evolución',notasHtml)}
  <div style="border-top:1px solid #eee;padding-top:12px;margin-top:20px;display:flex;justify-content:space-between;font-size:11px;color:#999">
    <span>${CENTRO}</span>
    <span>Atendido por: ${user.nombre} — ${fd(consulta.fecha)}</span>
  </div>
  </body></html>`);
  w.document.close();
}

// ── FORM CONSULTA ─────────────────────────────────────────────
function CForm({patient,user,consulta,onSave,onCancel}){
  const[f,setF]=useState(consulta||emptyC());
  const[nDx,setNDx]=useState({codigo:'',descripcion:'',tipo:'Definitivo'});
  const[nNota,setNNota]=useState('');
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const age=calcAge(patient.fechaNacimiento);
  const isPed=age&&age.years<18;
  const isVY=age&&age.totalMonths<=60;
  const oSex=patient.sexo==='F'?'girls':'boys';
  const nAge=isVY&&age?nearAge(age.totalMonths,OMS[oSex].weight):null;
  const imc=f.peso&&f.talla?calcIMC(f.peso,f.talla):null;
  const ic=imc?imcCat(imc):null;
  const wP=isVY&&nAge!=null&&f.peso?pct(parseFloat(f.peso),OMS[oSex].weight[nAge]):null;
  const hP=isVY&&nAge!=null&&f.talla?pct(parseFloat(f.talla),OMS[oSex].height[nAge]):null;
  const pCP=isVY&&nAge!=null&&f.perimetroCefalico?pct(parseFloat(f.perimetroCefalico),OMS[oSex].headCirc[nAge]):null;
  const taSis=parseFloat(f.taSis),taDia=parseFloat(f.taDia);
  const taC=f.taSis&&f.taDia?(taSis>=140||taDia>=90?'#b71c1c':taSis>=130||taDia>=80?'#e65100':'#1b5e20'):null;
  const taL=f.taSis&&f.taDia?(taSis>=140||taDia>=90?'HTA ⚠':taSis>=130||taDia>=80?'Elevada ⚠':'Normal ✓'):null;
  const gV=parseFloat(f.glicemia);
  const gC=f.glicemia?(gV>=200?'#b71c1c':gV>=126?'#e65100':gV>=100?'#f57f17':'#1b5e20'):null;
  const gL=f.glicemia?(gV>=200?'Hiperglicemia ⚠':gV>=126?'Criterio DM ⚠':gV>=100?'Prediabetes ⚠':'Normal ✓'):null;
  function addDx(){if(!nDx.descripcion.trim())return;setF(p=>({...p,diagnosticos:[...p.diagnosticos,{...nDx,id:Date.now().toString()}]}));setNDx({codigo:'',descripcion:'',tipo:'Definitivo'});}
  function remDx(id){setF(p=>({...p,diagnosticos:p.diagnosticos.filter(d=>d.id!==id)}));}
  function addNota(){if(!nNota.trim())return;const n={id:Date.now().toString(),fecha:new Date().toISOString().split('T')[0],hora:new Date().toTimeString().slice(0,5),texto:nNota,medico:user.nombre};setF(p=>({...p,notasEvolucion:[...p.notasEvolucion,n]}));setNNota('');}
  return(
    <div style={{maxWidth:820,margin:'0 auto',paddingBottom:50}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,paddingBottom:12,borderBottom:'2px solid #eee'}}>
        <div>
          <div style={{fontSize:17,fontWeight:600}}>Nueva consulta</div>
          <div style={{fontSize:12,color:'#666'}}>{patient.nombres} {patient.apellidos} {age?`· ${age.years}a ${age.months}m`:''}</div>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <input type="date" style={{...I,width:150}} value={f.fecha} onChange={e=>set('fecha',e.target.value)} />
          <input type="time" style={{...I,width:100}} value={f.hora} onChange={e=>set('hora',e.target.value)} />
          <button style={BS} onClick={onCancel}>Cancelar</button>
          <button style={BP(user.accent)} onClick={()=>onSave({...f,_imc:imc,medico:f.medico||user.nombre})}>💾 Guardar</button>
        </div>
      </div>
      <Card {...CC.celeste} icon="💬" title="Motivo de Consulta">
        <F label="Motivo de consulta *"><input style={I} value={f.motivoConsulta} onChange={e=>set('motivoConsulta',e.target.value)} placeholder="¿Por qué consulta hoy?" /></F>
        <F label="Enfermedad actual / anamnesis"><textarea style={{...TA,minHeight:100}} value={f.enfermedadActual} onChange={e=>set('enfermedadActual',e.target.value)} placeholder="Desarrollo cronológico: inicio, evolución, características, síntomas asociados..." /></F>
      </Card>
      <Card {...CC.teal} icon="🩺" title={`Examen Físico — ${isPed?'Pediátrico':'Adulto'}`}>
        {isPed&&isVY&&nAge!=null&&(
          <div style={{fontSize:12,color:'#185FA5',background:'#EBF4FD',border:'1px solid #85B7EB',borderRadius:6,padding:'8px 12px',marginBottom:12}}>
            Referencia OMS ({patient.sexo==='F'?'niña':'niño'} ≈ {nAge} meses) — Peso P50: {OMS[oSex].weight[nAge]?.[1]} kg · Talla P50: {OMS[oSex].height[nAge]?.[1]} cm · PC P50: {OMS[oSex].headCirc[nAge]?.[1]} cm
          </div>
        )}
        <div style={G3}>
          <F label="Peso (kg)">
            <input type="number" step="0.1" style={I} value={f.peso} onChange={e=>set('peso',e.target.value)} placeholder="kg" />
            {wP&&<div style={{fontSize:11,color:wP.c,marginTop:3,fontWeight:600}}>{wP.l}</div>}
          </F>
          <F label="Talla (cm)">
            <input type="number" step="0.1" style={I} value={f.talla} onChange={e=>set('talla',e.target.value)} placeholder="cm" />
            {hP&&<div style={{fontSize:11,color:hP.c,marginTop:3,fontWeight:600}}>{hP.l}</div>}
          </F>
          {!isPed?(
            <F label="IMC (calculado)" hint={ic?ic.l:''}>
              <input style={{...I,background:'#f5f5f5'}} value={imc||''} readOnly placeholder="Auto" />
              {ic&&<div style={{fontSize:11,color:ic.c,marginTop:3,fontWeight:600}}>{ic.l}</div>}
            </F>
          ):(
            <F label="Perímetro cefálico (cm)">
              <input type="number" step="0.1" style={I} value={f.perimetroCefalico} onChange={e=>set('perimetroCefalico',e.target.value)} />
              {pCP&&<div style={{fontSize:11,color:pCP.c,marginTop:3,fontWeight:600}}>{pCP.l}</div>}
            </F>
          )}
          {!isPed&&(
            <F label="Perímetro abdominal (cm)">
              <input type="number" step="0.5" style={I} value={f.perimetroAbdominal} onChange={e=>set('perimetroAbdominal',e.target.value)} />
              {f.perimetroAbdominal&&(()=>{const v=parseFloat(f.perimetroAbdominal);const al=(patient.sexo==='F'&&v>=88)||(patient.sexo==='M'&&v>=102);return<div style={{fontSize:11,color:al?'#b71c1c':'#2e7d32',marginTop:3,fontWeight:600}}>{al?'Obesidad central ⚠':'Normal ✓'} (≥{patient.sexo==='F'?88:102} cm)</div>;})()}
            </F>
          )}
        </div>
        <div style={{background:'#FAECE7',borderRadius:8,padding:'10px 12px',marginBottom:12}}>
          <div style={{fontSize:11,fontWeight:700,color:'#993C1D',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:8}}>Signos Vitales</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(145px,1fr))',gap:10}}>
            <div style={{background:'#fff0ee',border:'1px solid #F0997B44',borderRadius:8,padding:'10px 12px'}}>
              <div style={{fontSize:10,color:'#993C1D',fontWeight:700,marginBottom:6,textTransform:'uppercase'}}>Tensión Arterial</div>
              <div style={{display:'flex',gap:4,alignItems:'center'}}>
                <input type="number" style={{...I,textAlign:'center',fontSize:14,padding:'5px 4px'}} value={f.taSis} onChange={e=>set('taSis',e.target.value)} placeholder="SIS" />
                <span style={{color:'#993C1D',fontWeight:700}}>/</span>
                <input type="number" style={{...I,textAlign:'center',fontSize:14,padding:'5px 4px'}} value={f.taDia} onChange={e=>set('taDia',e.target.value)} placeholder="DIA" />
              </div>
              {taL&&<div style={{fontSize:11,color:taC,marginTop:4,fontWeight:600}}>{taL}</div>}
            </div>
            {[{k:'fc',label:'FC (lpm)',bg:'#EBF4FD',c:'#185FA5'},{k:'fr',label:'FR (rpm)',bg:'#EBF4FD',c:'#185FA5'}].map(s=>(
              <div key={s.k} style={{background:s.bg,border:`1px solid ${s.c}33`,borderRadius:8,padding:'10px 12px'}}>
                <div style={{fontSize:10,color:s.c,fontWeight:700,marginBottom:6,textTransform:'uppercase'}}>{s.label}</div>
                <input type="number" style={{...I,fontSize:14,padding:'5px 8px'}} value={f[s.k]} onChange={e=>set(s.k,e.target.value)} />

            ))}
            <div style={{background:'#FEF3DA',border:'1px solid #EF9F2733',borderRadius:8,padding:'10px 12px'}}>
              <div style={{fontSize:10,color:'#BA7517',fontWeight:700,marginBottom:6,textTransform:'uppercase'}}>Temperatura °C</div>
              <input type="number" step="0.1" style={{...I,fontSize:14,padding:'5px 8px'}} value={f.temp} onChange={e=>set('temp',e.target.value)} placeholder="°C" />
              {f.temp&&<div style={{fontSize:10,marginTop:4,fontWeight:600,color:parseFloat(f.temp)>=38?'#b71c1c':parseFloat(f.temp)<36?'#1565c0':'#2e7d32'}}>{parseFloat(f.temp)>=38?'Fiebre ⚠':parseFloat(f.temp)<36?'Hipotermia ⚠':'Normal ✓'}</div>}
            </div>
            <div style={{background:'#E0F5EE',border:'1px solid #5DCAA533',borderRadius:8,padding:'10px 12px'}}>
              <div style={{fontSize:10,color:'#0F6E56',fontWeight:700,marginBottom:6,textTransform:'uppercase'}}>SpO2 (%)</div>
              <input type="number" style={{...I,fontSize:14,padding:'5px 8px'}} value={f.sat} onChange={e=>set('sat',e.target.value)} max="100" placeholder="%" />
              {f.sat&&<div style={{fontSize:10,marginTop:4,fontWeight:600,color:parseFloat(f.sat)<90?'#b71c1c':parseFloat(f.sat)<94?'#e65100':'#2e7d32'}}>{parseFloat(f.sat)<90?'Hipoxemia severa ⚠':parseFloat(f.sat)<94?'Hipoxemia ⚠':'Normal ✓'}</div>}
            </div>
            <div style={{background:'#FEF3DA',border:`1px solid ${gC||'#EF9F27'}33`,borderRadius:8,padding:'10px 12px'}}>
              <div style={{fontSize:10,color:'#BA7517',fontWeight:700,marginBottom:6,textTransform:'uppercase'}}>Glicemia mg/dL</div>
              <input type="number" style={{...I,fontSize:14,padding:'5px 8px'}} value={f.glicemia} onChange={e=>set('glicemia',e.target.value)} placeholder="si amerita" />
              {gL&&<div style={{fontSize:10,marginTop:4,fontWeight:600,color:gC}}>{gL}</div>}
            </div>
          </div>
        </div>
        <F label="Examen físico por aparatos y sistemas"><textarea style={{...TA,minHeight:90}} value={f.examenFisico} onChange={e=>set('examenFisico',e.target.value)} placeholder="General, cabeza y cuello, tórax, cardiovascular, abdomen, extremidades, neurológico, piel y faneras..." /></F>
      </Card>
      <Card {...CC.ambar} icon="🔬" title="Diagnósticos">
        {f.diagnosticos.map(dx=>(
          <div key={dx.id} style={{display:'flex',gap:8,alignItems:'center',padding:'7px 10px',background:'#fffce8',borderRadius:6,marginBottom:6,border:'1px solid #EF9F2733'}}>
            <span style={{fontSize:11,padding:'2px 8px',borderRadius:20,background:dx.tipo==='Definitivo'?'#FAC775':dx.tipo==='Presuntivo'?'#B5D4F4':'#D3D1C7',color:dx.tipo==='Definitivo'?'#412402':dx.tipo==='Presuntivo'?'#042C53':'#2C2C2A',fontWeight:700,whiteSpace:'nowrap'}}>{dx.tipo}</span>
            {dx.codigo&&<span style={{fontSize:11,fontFamily:'monospace',color:'#999'}}>{dx.codigo}</span>}
            <span style={{fontSize:13,flex:1}}>{dx.descripcion}</span>
            <button style={BD} onClick={()=>remDx(dx.id)}>✕</button>
          </div>
        ))}
        <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap'}}>
          <input style={{...I,width:90}} value={nDx.codigo} onChange={e=>setNDx(d=>({...d,codigo:e.target.value}))} placeholder="CIE-10" />
          <input style={{...I,flex:1,minWidth:180}} value={nDx.descripcion} onChange={e=>setNDx(d=>({...d,descripcion:e.target.value}))} placeholder="Descripción del diagnóstico" />
          <select style={{...SE,width:130}} value={nDx.tipo} onChange={e=>setNDx(d=>({...d,tipo:e.target.value}))}><option>Definitivo</option><option>Presuntivo</option><option>Descartado</option></select>
          <button style={BP(user.accent)} onClick={addDx}>+ Agregar</button>
        </div>
      </Card>
      <Card {...CC.verde} icon="💊" title="Plan Terapéutico">
        <F label="Tratamiento farmacológico y no farmacológico"><textarea style={{...TA,minHeight:110}} value={f.tratamiento} onChange={e=>set('tratamiento',e.target.value)} placeholder={"1. Metformina 850mg VO c/12h con las comidas\n2. Losartán 50mg VO c/24h\n3. Dieta hipocalórica 1800 kcal/día\n4. Ejercicio aeróbico 150 min/semana\n5. Control en 4 semanas..."} /></F>
      </Card>
      <Card {...CC.violeta} icon="🔬" title="Pedido de exámenes de laboratorio clínico">
        <F label="Laboratorio clínico"><textarea style={{...TA,minHeight:95}} value={f.examenesLab || ''} onChange={e=>set('examenesLab',e.target.value)} placeholder={"Biometría hemática completa\nGlucosa en ayunas y HbA1c\nPerfil lipídico completo\nUrea, creatinina, TGO/TGP\nEMO / coproparasitario..."} /></F>
      </Card>
      <Card {...CC.celeste} icon="🖼️" title="Pedido de imágenes">
        <F label="Imágenes / radiología / ecografía"><textarea style={{...TA,minHeight:95}} value={f.examenesImagenes || ''} onChange={e=>set('examenesImagenes',e.target.value)} placeholder={"Ecografía abdominal\nRadiografía de tórax PA y lateral\nEcografía renal y vías urinarias\nTomografía / resonancia si amerita..."} /></F>
      </Card>
      <Card {...CC.coral} icon="📝" title="Notas de Evolución">
        {f.notasEvolucion.map(n=>(
          <div key={n.id} style={{padding:'10px 12px',background:'#fff5f2',borderRadius:6,marginBottom:8,borderLeft:'3px solid #D85A30'}}>
            <div style={{fontSize:11,color:'#999',marginBottom:4}}>{fd(n.fecha)} {n.hora} · {n.medico}</div>
            <div style={{fontSize:13,whiteSpace:'pre-wrap',lineHeight:1.6}}>{n.texto}</div>
          </div>
        ))}
        <div style={{display:'flex',gap:8,marginTop:8}}>
          <textarea style={{...TA,flex:1,minHeight:55}} value={nNota} onChange={e=>setNNota(e.target.value)} placeholder="Nueva nota de evolución..." />
          <button style={BP(user.accent)} onClick={addNota}>+ Nota</button>
        </div>
      </Card>
    </div>
  );
}

// ── VISTA CONSULTA ────────────────────────────────────────────
function CView({patient,user,consulta,onEdit,onDelete,onAddNota}){
  const[nNota,setNNota]=useState('');
  const age=calcAge(patient.fechaNacimiento);
  const isPed=age&&age.years<18;
  const imc=consulta._imc||(consulta.peso&&consulta.talla?calcIMC(consulta.peso,consulta.talla):null);
  const ic=imc?imcCat(imc):null;
  const taSis=parseFloat(consulta.taSis),taDia=parseFloat(consulta.taDia);
  const taC=(consulta.taSis&&consulta.taDia)?(taSis>=140||taDia>=90?'#b71c1c':taSis>=130||taDia>=80?'#e65100':'#1b5e20'):null;
  function aNota(){if(!nNota.trim())return;onAddNota({id:Date.now().toString(),fecha:new Date().toISOString().split('T')[0],hora:new Date().toTimeString().slice(0,5),texto:nNota,medico:user.nombre});setNNota('');}
  return(
    <div style={{maxWidth:820,margin:'0 auto',paddingBottom:50}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16,paddingBottom:12,borderBottom:'2px solid #eee'}}>
        <div>
          <div style={{fontSize:17,fontWeight:600}}>Consulta del {fd(consulta.fecha)} {consulta.hora}</div>
          <div style={{fontSize:12,color:'#666'}}>{patient.nombres} {patient.apellidos} · Atendido por: {consulta.medico||user.nombre}</div>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button style={BP('#0C447C')} onClick={()=>imprimirConsulta(patient,user,consulta)}>🖨️ Imprimir / PDF</button>
          <button style={BS} onClick={onEdit}>Editar</button>
          <button style={BD} onClick={()=>{if(window.confirm('¿Eliminar esta consulta?'))onDelete();}}>Eliminar</button>
        </div>
      </div>
      <Card {...CC.celeste} icon="💬" title="Motivo de Consulta">
        <div style={{fontSize:14,fontWeight:600,marginBottom:8}}>{consulta.motivoConsulta}</div>
        {consulta.enfermedadActual&&<div style={{fontSize:13,lineHeight:1.7,whiteSpace:'pre-wrap',color:'#444'}}>{consulta.enfermedadActual}</div>}
      </Card>
      <Card {...CC.teal} icon="🩺" title="Examen Físico">
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(120px,1fr))',gap:10,marginBottom:12}}>
          {consulta.peso&&<SV label="Peso" value={consulta.peso} unit="kg" bg="#E0F5EE" color="#0F6E56" />}
          {consulta.talla&&<SV label="Talla" value={consulta.talla} unit="cm" bg="#E0F5EE" color="#0F6E56" />}
          {!isPed&&imc&&<SV label="IMC" value={imc} unit="kg/m²" bg="#e8f5e9" color={ic?.c} flag={ic?.l} />}
          {isPed&&consulta.perimetroCefalico&&<SV label="P. Cefálico" value={consulta.perimetroCefalico} unit="cm" bg="#E0F5EE" color="#0F6E56" />}
          {!isPed&&consulta.perimetroAbdominal&&<SV label="P. Abdominal" value={consulta.perimetroAbdominal} unit="cm" bg="#EEEDFE" color="#534AB7" />}
          {(consulta.taSis||consulta.taDia)&&<SV label="T.A." value={`${consulta.taSis||'?'}/${consulta.taDia||'?'}`} unit="mmHg" bg="#FAECE7" color={taC||'#993C1D'} />}
          {consulta.fc&&<SV label="FC" value={consulta.fc} unit="lpm" bg="#EBF4FD" color="#185FA5" />}
          {consulta.fr&&<SV label="FR" value={consulta.fr} unit="rpm" bg="#EBF4FD" color="#185FA5" />}
          {consulta.temp&&<SV label="Temperatura" value={consulta.temp} unit="°C" bg="#FEF3DA" color="#BA7517" flag={parseFloat(consulta.temp)>=38?'Fiebre ⚠':parseFloat(consulta.temp)<36?'Hipotermia ⚠':null} />}
          {consulta.sat&&<SV label="SpO2" value={consulta.sat} unit="%" bg="#E0F5EE" color="#0F6E56" />}
          {consulta.glicemia&&<SV label="Glicemia" value={consulta.glicemia} unit="mg/dL" bg="#FEF3DA" color="#BA7517" />}
        </div>
        {consulta.examenFisico&&<div style={{fontSize:13,lineHeight:1.7,whiteSpace:'pre-wrap',borderTop:'1px solid #ddd',paddingTop:10}}>{consulta.examenFisico}</div>}
      </Card>
      {consulta.diagnosticos?.length>0&&(
        <Card {...CC.ambar} icon="🔬" title="Diagnósticos">
          {consulta.diagnosticos.map((dx,i)=>(
            <div key={i} style={{display:'flex',gap:8,padding:'7px 0',borderBottom:'1px solid #EF9F2733',alignItems:'center'}}>
              <span style={{fontSize:11,padding:'2px 8px',borderRadius:20,background:dx.tipo==='Definitivo'?'#FAC775':dx.tipo==='Presuntivo'?'#B5D4F4':'#D3D1C7',color:dx.tipo==='Definitivo'?'#412402':dx.tipo==='Presuntivo'?'#042C53':'#2C2C2A',fontWeight:700,whiteSpace:'nowrap'}}>{dx.tipo}</span>
              {dx.codigo&&<span style={{fontSize:11,fontFamily:'monospace',color:'#999'}}>{dx.codigo}</span>}
              <span style={{fontSize:13}}>{dx.descripcion}</span>
            </div>
          ))}
        </Card>
      )}
      {consulta.tratamiento&&<Card {...CC.verde} icon="💊" title="Plan Terapéutico"><div style={{fontSize:13,lineHeight:1.8,whiteSpace:'pre-wrap'}}>{consulta.tratamiento}</div></Card>}
      {(consulta.examenesLab || consulta.examenes)&&<Card {...CC.violeta} icon="🔬" title="Pedido de exámenes de laboratorio clínico"><div style={{fontSize:13,lineHeight:1.8,whiteSpace:'pre-wrap'}}>{consulta.examenesLab || consulta.examenes}</div></Card>}
      {consulta.examenesImagenes&&<Card {...CC.celeste} icon="🖼️" title="Pedido de imágenes"><div style={{fontSize:13,lineHeight:1.8,whiteSpace:'pre-wrap'}}>{consulta.examenesImagenes}</div></Card>}
      <Card {...CC.coral} icon="📝" title="Notas de Evolución">
        {!consulta.notasEvolucion?.length&&<div style={{fontSize:12,color:'#999',marginBottom:10}}>Sin notas registradas.</div>}
        {consulta.notasEvolucion?.map(n=>(
          <div key={n.id} style={{padding:'10px 12px',background:'#fff5f2',borderRadius:6,marginBottom:8,borderLeft:'3px solid #D85A30'}}>
            <div style={{fontSize:11,color:'#999',marginBottom:4}}>{fd(n.fecha)} {n.hora} · {n.medico||''}</div>
            <div style={{fontSize:13,whiteSpace:'pre-wrap',lineHeight:1.6}}>{n.texto}</div>
          </div>
        ))}
        <div style={{display:'flex',gap:8,marginTop:10}}>
          <textarea style={{...TA,flex:1,minHeight:55}} value={nNota} onChange={e=>setNNota(e.target.value)} placeholder="Agregar nota de evolución..." />
          <button style={BP(user.accent)} onClick={aNota}>+ Nota</button>
        </div>
      </Card>
    </div>
  );
}

// ── DETALLE PACIENTE ──────────────────────────────────────────
function PxDetail({patient,user,onEdit,onNewC,onViewC,onDelete}){
  const[tab,setTab]=useState('consultas');
  const age=calcAge(patient.fechaNacimiento);
  const isF=patient.sexo==='F';
  const eg=patient.embarazada==='Sí'&&patient.fum?calcEG(patient.fum):null;
  const TABS=[
    {id:'consultas',   label:'Consultas',    icon:'📋',...CC.teal},
    {id:'filiacion',   label:'Filiación',    icon:'👤',...CC.azul},
    {id:'antecedentes',label:'Antecedentes', icon:'📂',...CC.violeta},
    {id:'habitos',     label:'Hábitos',      icon:'🥗',...CC.verde},
  ];
  const IR=({label,value})=>(!value&&value!==0)?null:(
    <div style={{display:'flex',gap:8,padding:'6px 0',borderBottom:'1px solid #eee'}}>
      <span style={{fontSize:12,color:'#666',minWidth:185,flexShrink:0}}>{label}</span>
      <span style={{fontSize:13}}>{value}</span>
    </div>
  );
  return(
    <div style={{maxWidth:820,margin:'0 auto',paddingBottom:50}}>
      <div style={{background:'#0F4C75',borderRadius:10,padding:'16px 20px',marginBottom:14,color:'#fff'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div style={{fontSize:21,fontWeight:700}}>{patient.nombres} {patient.apellidos}</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:12,marginTop:6,fontSize:13,opacity:0.85}}>
              {age&&<span>{age.years}a {age.months}m</span>}
              <span>{patient.sexo==='M'?'Masculino':'Femenino'}</span>
              {patient.cedula&&<span>CI: {patient.cedula}</span>}
              {patient.telefono&&<span>📞 {patient.telefono}</span>}
              {patient.ocupacion&&<span>{patient.ocupacion}</span>}
            </div>
            {eg&&<div style={{marginTop:8,fontSize:13,background:'rgba(255,255,255,0.12)',display:'inline-block',padding:'4px 14px',borderRadius:20}}>Embarazada — {eg.weeks} sem {eg.days>0?`+ ${eg.days}d`:''} · FPP: {fd(calcFPP(patient.fum))}</div>}
          </div>
          <div style={{display:'flex',gap:8}}>
            <button style={{padding:'7px 12px',fontSize:12,borderRadius:6,cursor:'pointer',background:'rgba(255,255,255,0.15)',border:'1px solid rgba(255,255,255,0.3)',color:'#fff'}} onClick={onEdit}>Editar</button>
            <button style={{padding:'7px 12px',fontSize:12,borderRadius:6,cursor:'pointer',background:'rgba(255,100,100,0.2)',border:'1px solid rgba(255,100,100,0.4)',color:'#ffcdd2'}} onClick={onDelete}>Eliminar</button>
          </div>
        </div>
      </div>
      <div style={{display:'flex',gap:6,marginBottom:16}}>
        {TABS.map(t=>{const isA=tab===t.id;return(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'9px 4px',fontSize:11,fontWeight:600,cursor:'pointer',borderRadius:8,border:isA?`2px solid ${t.border}`:'1px solid #ddd',background:isA?t.hBg:'#fff',color:isA?'#fff':'#666',display:'flex',flexDirection:'column',alignItems:'center',gap:3,boxShadow:isA?`0 2px 8px ${t.hBg}55`:'none',transition:'all 0.15s'}}>
            <span style={{fontSize:18}}>{t.icon}</span>
            <span>{t.label}{t.id==='consultas'?` (${patient.consultas?.length||0})`:''}</span>
          </button>
        );})}
      </div>
      {tab==='consultas'&&(
        <div>
          <button style={{...BP(user.accent),width:'100%',padding:'11px',fontSize:14,borderRadius:8,marginBottom:12}} onClick={onNewC}>+ Nueva consulta</button>
          {!patient.consultas?.length?(
            <div style={{textAlign:'center',padding:'50px 0',color:'#bbb',fontSize:14}}>Sin consultas registradas</div>
          ):[...patient.consultas].reverse().map(c=>(
            <button key={c.id} onClick={()=>onViewC(c)} style={{width:'100%',textAlign:'left',padding:'12px 14px',background:'#fff',border:'1px solid #eee',borderRadius:8,marginBottom:6,cursor:'pointer',boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div>
                  <div style={{fontSize:13,fontWeight:600}}>{fd(c.fecha)} {c.hora}</div>
                  <div style={{fontSize:12,color:'#777',marginTop:3}}>{c.motivoConsulta||'Sin motivo registrado'}</div>
                  {c.diagnosticos?.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:4,marginTop:6}}>{c.diagnosticos.slice(0,3).map((dx,i)=><span key={i} style={{fontSize:11,padding:'2px 8px',borderRadius:20,background:'#FAEEDA',color:'#633806',fontWeight:600}}>{dx.descripcion}</span>)}{c.diagnosticos.length>3&&<span style={{fontSize:11,color:'#999'}}>+{c.diagnosticos.length-3} más</span>}</div>}
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:4,alignItems:'flex-end'}}>
                  {c.medico&&<span style={{fontSize:11,color:'#185FA5'}}>{c.medico}</span>}
                  {c.notasEvolucion?.length>0&&<span style={{fontSize:11,color:'#993C1D',background:'#FAECE7',padding:'2px 8px',borderRadius:20}}>{c.notasEvolucion.length} nota{c.notasEvolucion.length>1?'s':''}</span>}
                </div>
              </div>
            </button>
          ))}
        </div>
      )}
      {tab==='filiacion'&&(
        <Card {...CC.azul} icon="👤" title="Datos de Filiación">
          <IR label="Nombres completos" value={`${patient.nombres} ${patient.apellidos}`} />
          <IR label="Fecha de nacimiento" value={fd(patient.fechaNacimiento)} />
          <IR label="Edad" value={age?`${age.years} años ${age.months} meses`:null} />
          <IR label="Sexo" value={patient.sexo==='M'?'Masculino':'Femenino'} />
          <IR label="Cédula / ID" value={patient.cedula} />
          <IR label="Estado civil" value={patient.estadoCivil} />
          <IR label="Religión" value={patient.religion} />
          <IR label="Ocupación" value={patient.ocupacion} />
          <IR label="Teléfono" value={patient.telefono} />
          <IR label="Email" value={patient.email} />
          <IR label="Dirección" value={patient.direccion} />
          {patient.creadoPor&&<IR label="Registrado por" value={patient.creadoPor} />}
        </Card>
      )}
      {tab==='antecedentes'&&(
        <div>
          <Card {...CC.violeta} icon="🏥" title="Antecedentes Patológicos"><div style={{fontSize:13,lineHeight:1.7,whiteSpace:'pre-wrap'}}>{patient.antPatologicos||<span style={{color:'#bbb'}}>No registrado</span>}</div></Card>
          <Card {...CC.gris} icon="🔧" title="Antecedentes Quirúrgicos"><div style={{fontSize:13,lineHeight:1.7,whiteSpace:'pre-wrap'}}>{patient.antQuirurgicos||<span style={{color:'#bbb'}}>No registrado</span>}</div></Card>
          {patient.antAlergias&&<Card {...CC.coral} icon="⚠️" title="Alergias"><div style={{fontSize:13,fontWeight:600,color:'#993C1D'}}>{patient.antAlergias}</div></Card>}
          {patient.antFamiliares&&<Card {...CC.celeste} icon="👨‍👩‍👧" title="Antecedentes Familiares"><div style={{fontSize:13,lineHeight:1.7}}>{patient.antFamiliares}</div></Card>}
          {isF&&(
            <Card {...CC.rosa} icon="🌸" title="Antecedentes Ginecoobstétricos">
              <IR label="Menarquía" value={patient.menarquia?`${patient.menarquia} años`:null} />
              <IR label="Ciclos / Duración" value={patient.ciclosRegulares?(patient.ciclosRegulares+(patient.duracionCiclo?' — '+patient.duracionCiclo+'d':'')):null} />
              <IR label="Cantidad del flujo" value={patient.cantidadFlujo} />
              <IR label="Inicio vida sexual" value={patient.inicioVidaSexual?`${patient.inicioVidaSexual} años`:null} />
              <IR label="N° de parejas" value={patient.numParejas} />
              {(patient.gesta||patient.para)&&<IR label="Fórmula obstétrica" value={`G${patient.gesta||0} P${patient.para||0} C${patient.cesareas||0} A${patient.abortos||0}`} />}
              <IR label="Menopausia" value={patient.menopausia} />
              <IR label="PAP Test" value={patient.papTest==='Sí'?`Sí — ${fd(patient.papTestFecha)||'sin fecha'}`:patient.papTest} />
              <IR label="Mamografía" value={patient.mamografia==='Sí'?`Sí — ${fd(patient.mamografiaFecha)||'sin fecha'}`:patient.mamografia} />
              <IR label="Anticoncepción" value={patient.anticonceptivos?`${patient.anticonceptivos}${patient.anticonceptivosDetalle?' — '+patient.anticonceptivosDetalle:''}`:null} />
              <IR label="FUM" value={fd(patient.fum)} />
              <IR label="Embarazo actual" value={patient.embarazada} />
              {eg&&<IR label="Edad gestacional" value={`${eg.weeks} semanas${eg.days?' + '+eg.days+'d':''}`} />}
              {patient.embarazada==='Sí'&&patient.fum&&<IR label="FPP" value={fd(calcFPP(patient.fum))} />}
            </Card>
          )}
        </div>
      )}
      {tab==='habitos'&&(
        <div>
          <Card {...CC.verde} icon="🥗" title="Alimentación"><div style={{fontSize:13,lineHeight:1.7,whiteSpace:'pre-wrap'}}>{patient.alimentacion||<span style={{color:'#bbb'}}>No registrado</span>}</div></Card>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <Card {...CC.coral} icon="🍺" title="Alcohol"><div style={{fontSize:13}}>{patient.alcohol||'—'}</div>{patient.alcoholDetalle&&<div style={{fontSize:12,color:'#666',marginTop:4}}>{patient.alcoholDetalle}</div>}</Card>
            <Card {...CC.gris} icon="🚬" title="Tabaco"><div style={{fontSize:13}}>{patient.cigarrillo||'—'}</div>{patient.cigarrilloDetalle&&<div style={{fontSize:12,color:'#666',marginTop:4}}>{patient.cigarrilloDetalle}</div>}</Card>
          </div>
          {patient.otrosHabitos&&<Card {...CC.celeste} icon="🏃" title="Otros Hábitos" style={{marginTop:12}}><div style={{fontSize:13,lineHeight:1.6}}>{patient.otrosHabitos}</div></Card>}
        </div>
      )}
    </div>
  );
}

// ── APP PRINCIPAL ─────────────────────────────────────────────
function App(){
  const[patients,setPatients]=useState([]);
  const[loading,setLoading]=useState(true);
  const[user,setUser]=useState(null);
  const[search,setSearch]=useState('');
  const[view,setView]=useState('home');
  const[selPx,setSelPx]=useState(null);
  const[selC,setSelC]=useState(null);
  const[saving,setSaving]=useState(false);

  useEffect(()=>{apiLoad().then(p=>{setPatients(p);setLoading(false);});},[]);

  const persist=async(pts)=>{
    setPatients(pts);
    setSaving(true);
    await apiSave(pts);
    setSaving(false);
  };
  const getPx=(id)=>patients.find(p=>p.id===id);

  async function savePx(data){
    const ex=patients.findIndex(p=>p.id===data.id);
    const pts=ex>=0?patients.map(p=>p.id===data.id?{...p,...data}:p):[...patients,data];
    await persist(pts);setSelPx(data);setView('patient');
  }
  async function delPx(id){
    if(!window.confirm('¿Eliminar esta historia clínica? No se puede deshacer.'))return;
    await persist(patients.filter(p=>p.id!==id));setSelPx(null);setView('home');
  }
  async function saveC(data){
    const cur=getPx(selPx.id);
    const cs=cur.consultas||[];
    const nCs=cs.find(c=>c.id===data.id)?cs.map(c=>c.id===data.id?data:c):[...cs,data];
    const upd={...cur,consultas:nCs};
    await persist(patients.map(p=>p.id===cur.id?upd:p));
    setSelPx(upd);setSelC(data);setView('viewC');
  }
  async function delC(id){
    const cur=getPx(selPx.id);
    const upd={...cur,consultas:(cur.consultas||[]).filter(c=>c.id!==id)};
    await persist(patients.map(p=>p.id===cur.id?upd:p));
    setSelPx(upd);setSelC(null);setView('patient');
  }
  async function addNota(nota){
    const cur=getPx(selPx.id);
    const uC={...selC,notasEvolucion:[...(selC.notasEvolucion||[]),nota]};
    const upd={...cur,consultas:(cur.consultas||[]).map(c=>c.id===selC.id?uC:c)};
    await persist(patients.map(p=>p.id===cur.id?upd:p));
    setSelPx(upd);setSelC(uC);
  }

  const filtered=patients.filter(p=>`${p.nombres} ${p.apellidos} ${p.cedula}`.toLowerCase().includes(search.toLowerCase()));

  if(loading)return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:12,background:'#f0f4f8'}}>
      <div style={{width:50,height:50,background:'#0F4C75',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',color:'#B5D4F4',fontSize:20,fontWeight:700}}>HC</div>
      <div style={{fontSize:14,color:'#666'}}>Cargando historias clínicas...</div>
    </div>
  );
  if(!user)return <Login onLogin={setUser}/>;

  const Crumb=()=>(
    <div style={{display:'flex',gap:6,fontSize:12,color:'#999',marginBottom:16,alignItems:'center'}}>
      <button style={{background:'none',border:'none',cursor:'pointer',color:'#555',padding:0,fontSize:12}} onClick={()=>setView('home')}>Inicio</button>
      {selPx&&<><span>›</span><button style={{background:'none',border:'none',cursor:'pointer',color:'#555',padding:0,fontSize:12}} onClick={()=>{setSelC(null);setView('patient');}}>{selPx.nombres} {selPx.apellidos}</button></>}
      {['newC','editC'].includes(view)&&<><span>›</span><span>Consulta</span></>}
      {view==='viewC'&&selC&&<><span>›</span><span>{fd(selC.fecha)}</span></>}
      {['newPx','editPx'].includes(view)&&<><span>›</span><span>{view==='newPx'?'Nuevo paciente':'Editar paciente'}</span></>}
    </div>
  );

  return(
    <div style={{display:'flex',height:'100vh',overflow:'hidden'}}>
      {/* Sidebar */}
      <div style={{width:232,borderRight:'1px solid #e0e0e0',display:'flex',flexDirection:'column',flexShrink:0,background:'#fff'}}>
        <div style={{padding:'14px 12px',borderBottom:'1px solid #e0e0e0',background:user.bg}}>
          <div style={{fontSize:9,fontWeight:700,color:user.color,textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:8,lineHeight:1.4}}>{CENTRO}</div>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
            <div style={{width:36,height:36,borderRadius:'50%',background:user.accent,display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:11,fontWeight:700,flexShrink:0}}>{user.initials}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:12,fontWeight:700,color:user.color,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{user.nombre}</div>
              <div style={{fontSize:11,color:user.accent}}>{user.especialidad}</div>
            </div>
            <button onClick={()=>setUser(null)} style={{fontSize:10,background:'transparent',border:`1px solid ${user.accent}66`,borderRadius:4,padding:'2px 6px',cursor:'pointer',color:user.color}}>Salir</button>
          </div>
          <input style={{...I,fontSize:12,background:'rgba(255,255,255,0.8)'}} placeholder="🔍 Buscar paciente..." value={search} onChange={e=>setSearch(e.target.value)} />
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'8px'}}>
          <button style={{...BP(user.accent),width:'100%',fontSize:12,marginBottom:8}} onClick={()=>{setSelPx(null);setView('newPx');}}>+ Nuevo paciente</button>
          <a href="/api/backup" style={{display:'block',textAlign:'center',fontSize:11,color:'#999',textDecoration:'none',marginBottom:8,padding:'4px',borderRadius:4,border:'1px solid #eee'}} title="Descargar respaldo JSON">⬇️ Backup datos</a>
          {filtered.length===0?(
            <div style={{textAlign:'center',padding:'20px 0',fontSize:12,color:'#bbb'}}>{patients.length===0?'Sin pacientes aún':'Sin resultados'}</div>
          ):filtered.map(p=>{
            const a=calcAge(p.fechaNacimiento);
            const isSel=selPx?.id===p.id;
            return(
              <button key={p.id} onClick={()=>{setSelPx(p);setSelC(null);setView('patient');}} style={{width:'100%',textAlign:'left',padding:'9px 10px',borderRadius:6,marginBottom:2,cursor:'pointer',border:isSel?`1.5px solid ${user.accent}`:'1px solid transparent',background:isSel?user.bg:'transparent'}}>
                <div style={{fontSize:12,fontWeight:600,color:isSel?user.color:'#222'}}>{p.nombres} {p.apellidos}</div>
                <div style={{fontSize:11,color:'#999',marginTop:2}}>{a?`${a.years}a`:''} · {p.sexo==='M'?'M':'F'} · {p.consultas?.length||0} consulta{p.consultas?.length!==1?'s':''}</div>
              </button>
            );
          })}
        </div>
        <div style={{padding:'8px 12px',borderTop:'1px solid #eee',fontSize:11,color:'#bbb',textAlign:'center',display:'flex',justifyContent:'space-between'}}>
          <span>{patients.length} paciente{patients.length!==1?'s':''}</span>
          <span style={{color:saving?'#e65100':'#bbb'}}>{saving?'Guardando...':'✓ Guardado'}</span>
        </div>
      </div>

      {/* Main */}
      <div style={{flex:1,overflowY:'auto',padding:'24px 32px',background:'#f8f9fa'}}>
        {view!=='home'&&<Crumb/>}
        {view==='home'&&(
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:'70vh',flexDirection:'column',gap:14}}>
            <div style={{width:72,height:72,background:user.bg,border:`3px solid ${user.accent}`,borderRadius:18,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,fontWeight:700,color:user.color}}>{user.initials}</div>
            <div style={{fontSize:22,fontWeight:700,color:'#0F4C75'}}>Historia Clínica Electrónica</div>
            <div style={{fontSize:13,color:'#666',textAlign:'center',maxWidth:400,lineHeight:1.6}}>{CENTRO}</div>
            <div style={{fontSize:14,color:user.accent,fontWeight:700}}>{user.nombre} — {user.especialidad}</div>
            <button style={{...BP(user.accent),marginTop:8,fontSize:15,padding:'12px 32px',borderRadius:10}} onClick={()=>setView('newPx')}>+ Registrar nuevo paciente</button>
            {patients.length>0&&<div style={{fontSize:12,color:'#bbb'}}>O seleccione un paciente del panel izquierdo ({patients.length} registrado{patients.length!==1?'s':''})</div>}
          </div>
        )}
        {(view==='newPx'||view==='editPx')&&<PxForm patient={view==='editPx'?selPx:null} user={user} onSave={savePx} onCancel={()=>setView(selPx?'patient':'home')} />}
        {view==='patient'&&selPx&&<PxDetail patient={getPx(selPx.id)||selPx} user={user} onEdit={()=>setView('editPx')} onNewC={()=>{setSelC(null);setView('newC');}} onViewC={c=>{setSelC(c);setView('viewC');}} onDelete={()=>delPx(selPx.id)} />}
        {(view==='newC'||view==='editC')&&selPx&&<CForm patient={getPx(selPx.id)||selPx} user={user} consulta={view==='editC'?selC:null} onSave={saveC} onCancel={()=>setView(selC?'viewC':'patient')} />}
        {view==='viewC'&&selPx&&selC&&<CView patient={getPx(selPx.id)||selPx} user={user} consulta={(getPx(selPx.id)?.consultas||[]).find(c=>c.id===selC.id)||selC} onEdit={()=>setView('editC')} onDelete={()=>delC(selC.id)} onAddNota={addNota} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
